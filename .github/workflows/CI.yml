name: CI

on:
  push:
    branches: ["main"] 

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NOTE:
        # as we upgrade CI, testing, and publication we should be more
        # intentional about the operating systems and begin to pin
        # specific versions (not just "latest")
        # please submit PRs for any operating system YOU might want to use!
        # see: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        os: [macos-26, windows-11-arm, macos-26-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install UV
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install

      - name: Install uv project 
        run: uv sync --locked --all-extras --dev

      - name: Build Zig Binaries
        run: uv run python -m ziglang build #TODO: maybe test the zig library later?
      
      - name: Build Binary Folder 
        run: mkdir -p src/neurovolume/_native
        shell: bash
        
      - name: Build Python Library
        run: uv build

      - name: Test Python Library
        run: uv run pytest -s tests
