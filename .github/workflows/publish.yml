# entire file is LLM copypasta from claude
# SOURCE: based on:
# https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
name: "Publish"
on:
  push:
    tags:
      # publish any tag starting with 'v' (version convention)
      - v*
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15      # Apple Silicon (ARM64)
            target: macos-15
          - os: macos-26-intel      # Intel (x86_64)
            target: macos-26-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        run: uv python install
      - name: Install uv project
        run: uv sync --locked --all-extras --dev

      - name: Build Zig Binaries
        run: uv run python -m ziglang build

      - name: Build Binary Folder
        run: mkdir -p src/neurovolume/_native
        shell: bash

      - name: Build Python Library
        run: uv build

      - name: Test Python Library
        run: uv run pytest -s tests

      - name: List built distributions
        run: ls -la dist/
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List downloaded distributions
        run: ls -la dist/

      - name: Install UV
        uses: astral-sh/setup-uv@v6

      - name: Publish
        run: uv publish
