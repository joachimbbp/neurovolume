# entire file is LLM copypasta from claude
# SOURCE: based on:
# https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
name: "Publish"
on:
  push:
    tags:
      # publish any tag starting with 'v' (version convention)
      - v*
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [
        # TODO: after Zig is updated, add macos-26
        # WARN: this should mirror what was tested and confirmed as working
        # in CI.yml
        # there isn't a non terrible way to DRY this in yml, so as long
        # as we're on github actions this is probably the way it has
        # to be! (submit PRs and email me if you know a better way)
            "macos-15",
            "macos-26-intel",
            "macos-15-intel",
            "windows-2025",
            # "ubuntu-24.04" # breaks sometimes (but not all the time)
            ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install UV
        uses: astral-sh/setup-uv@v6
      - name: Setup Python
        run: uv python install
      - name: Install uv project
        run: uv sync --locked --all-extras --dev

      - name: Build Zig Binaries
        run: uv run python -m ziglang build

      - name: Build Binary Folder
        run: mkdir -p src/neurovolume/_native
        shell: bash

      - name: Build Python Library
        run: uv build

      - name: Test Python Library
        run: uv run pytest -s tests

      - name: List built distributions
        run: ls -la dist/
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os}}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List downloaded distributions
        run: ls -la dist/

      - name: Install UV
        uses: astral-sh/setup-uv@v6

      - name: Publish
        run: uv publish
